---
# tasks file for portfolio
# SPDX-License-Identifier: MIT-0
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install Nginx web server
  become: true
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Ensure Nginx service is started and enabled
  become: true
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Deploy website files
  become: true
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: /var/www/html/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  notify: Restart Nginx
